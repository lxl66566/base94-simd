[package]
name = "base94-simd-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[[bin]]
doc = false
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false

[[bin]]
doc = false
name = "decode_matches_reference"
path = "fuzz_targets/decode_matches_reference.rs"
test = false

[[bin]]
doc = false
name = "encode_matches_reference"
path = "fuzz_targets/encode_matches_reference.rs"
test = false

[[bin]]
doc = false
name = "decimal_roundtrip"
path = "fuzz_targets/decimal_roundtrip.rs"
test = false

[dependencies]
base94-simd = { path = "..", features = ["kf"] }
libfuzzer-sys = "0.4"
rand = "0.10"
